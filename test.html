<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Number Generator</title>
</head>
<body>
<h1>Random Number Generator</h1>
<p id="randomNumber"></p>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  async function fetchRandomNumber() {
    const options = {
      method: 'GET',
      url: 'https://random-number6.p.rapidapi.com/int',
      params: {
        min: '20000',
        max: '50000'
      },
      headers: {
        'X-RapidAPI-Key': 'c18eed165bmsh2a15e18504749ffp18e97ejsn0546bcdfba19',
        'X-RapidAPI-Host': 'random-number6.p.rapidapi.com'
      }
    };

    try {
      const response = await axios.request(options);
      document.getElementById('randomNumber').textContent = `Random Number: ${response.data}`;
    } catch (error) {
      console.error(error);
    }
  }

  fetchRandomNumber();
</script>
</body>
</html>
