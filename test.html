<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam API Example</title>
</head>
<body>
    <h1>Current Player Count</h1>
    <div id="playerCount"></div>

    <script>
        async function fetchPlayerCount() {
            const url = 'https://steam-api-client-access.p.rapidapi.com/currentPlayerCount/1966720';
            const options = {
                method: 'GET',
                headers: {
                    'X-RapidAPI-Key': 'c18eed165bmsh2a15e18504749ffp18e97ejsn0546bcdfba19',
                    'X-RapidAPI-Host': 'steam-api-client-access.p.rapidapi.com'
                }
            };

            try {
                const response = await fetch(url, options);
                const result = await response.json();
                return result;
            } catch (error) {
                console.error("Error fetching player count:", error);
            }
        }

        async function displayPlayerCount() {
            const playerCountDiv = document.getElementById('playerCount');
            const playerCountData = await fetchPlayerCount();
            if (playerCountData && playerCountData.player_count !== undefined) {
                playerCountDiv.innerText = `Current Player Count: ${playerCountData.player_count}`;
            } else {
                playerCountDiv.innerText = "Unable to fetch player count.";
            }
        }

        displayPlayerCount();
    </script>
</body>
</html>
