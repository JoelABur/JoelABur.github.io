<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam API Fetch</title>
</head>
<body>
<script>
  const requestOptions = {
    method: "GET",
    redirect: "follow"
  };

  fetch("https://api.steampowered.com/ISteamUserStats/GetNumberOfCurrentPlayers/v1/?appid=1966720", requestOptions)
    .then(response => response.json())
    .then(result => {
      // Display the result
      document.body.innerHTML = "<pre>" + JSON.stringify(result, null, 2) + "</pre>";
    })
    .catch(error => console.error('Error:', error));
</script>
</body>
</html>
