<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam App Details</title>
  <style>
    /* Add your CSS styles here */
  </style>
</head>
<body>
  <div id="appDetails">
    <!-- Data will be displayed here -->
  </div>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    async function fetchAppDetails() {
      const options = {
        method: 'GET',
        url: 'https://steam2.p.rapidapi.com/appDetail/1966720',
        headers: {
          'X-RapidAPI-Key': 'c18eed165bmsh2a15e18504749ffp18e97ejsn0546bcdfba19',
          'X-RapidAPI-Host': 'steam2.p.rapidapi.com'
        }
      };

      try {
        const response = await axios.request(options);
        displayAppDetails(response.data);
      } catch (error) {
        console.error(error);
      }
    }

    function displayAppDetails(data) {
      const appDetailsContainer = document.getElementById('appDetails');
      // Clear previous content
      appDetailsContainer.innerHTML = '';

      // Display relevant data
      const { name, developers, publishers, price_overview, genres } = data;

      const html = `
        <h1>${name}</h1>
        <p><strong>Developers:</strong> ${developers.join(', ')}</p>
        <p><strong>Publishers:</strong> ${publishers.join(', ')}</p>
        <p><strong>Price:</strong> ${price_overview ? price_overview.final_formatted : 'N/A'}</p>
        <p><strong>Genres:</strong> ${genres.map(genre => genre.description).join(', ')}</p>
      `;

      appDetailsContainer.innerHTML = html;
    }

    fetchAppDetails();
  </script>
</body>
</html>
