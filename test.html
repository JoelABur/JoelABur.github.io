<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Game Stats</title>
</head>
<body>
    <h1>Steam Game Stats</h1>
    <div id="gameStats"></div>

    <script>
        async function fetchGameStats() {
            const url = 'https://steamcharts.p.rapidapi.com/api/v1/games/1966720';
            const options = {
                method: 'GET',
                headers: {
                    'X-RapidAPI-Key': 'c18eed165bmsh2a15e18504749ffp18e97ejsn0546bcdfba19',
                    'X-RapidAPI-Host': 'steamcharts.p.rapidapi.com'
                }
            };

            try {
                const response = await fetch(url, options);
                const result = await response.json();
                displayGameStats(result);
            } catch (error) {
                console.error(error);
            }
        }

        function displayGameStats(stats) {
            const gameStatsContainer = document.getElementById('gameStats');
            const statsHTML = `
                <p>Current Players: ${stats.current_players}</p>
                <p>Peak Players Today: ${stats.peak_players_today}</p>
                <p>Peak Players: ${stats.peak_players}</p>
            `;
            gameStatsContainer.innerHTML = statsHTML;
        }

        fetchGameStats();
    </script>
</body>
</html>
