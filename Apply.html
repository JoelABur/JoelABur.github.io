<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{ 
            background-image:url('https://steamuserimages-a.akamaihd.net/ugc/2292958473539643970/B2DE4D01BFF86A45CCA182FBECC0758A51571BC5/?imw=512&&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false'); 
            background-repeat: no-repeat;
            background-size: cover; 
            margin: 0;
            padding: 0; 
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Compnay™</title>
    <link rel="icon" type="image/x-icon" href="./images/logo.png">
    <link rel="stylesheet" href="./css/three-5.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body style="background-color:rgb(0, 0, 0)">
    <nav class="navbar">
        <div class="container">
            <a href="index.html"> 
                <div class="logo">
                    <img src="./images/logo.png" alt="Logo">
                </div>
            </a>
            <div class="search">
                <input type="text" placeholder="> Search" class="search-input">
            </div>
            <script src="./js/search.js"></script>
            <div class="dropdown">
                <button class="dropbtn">Menu</button>
                <div class="dropdown-content">
                    <a href="index.html">Home</a>
                    <a href="About_us.html">About us</a>
                    <a href="Job_info.html">Jobs</a>
                    <a href="Apply.html">Apply</a>
                </div>
            </div>
        </div>
    </nav>

    
    <div class="row">
        <div class="col">
            <img src="https://preview.redd.it/the-company-needs-you-v0-0o82rfs7ns1c1.png?auto=webp&s=5c01de0ca84268b2a3c5d16a965c1c38360a1c6c" alt="Left Image">
        </div>            
        <div class="right-column">
            <div class="card" style="background-color: #000000; border: 1px solid #ff0000;">
                <h2 style="color: #ff0000;">Thank you for choosing to work at The Company.</h2>
                <p style="color: #ff0000;">Please fill out the information below in the order presented:</p>
                <div class="card-content">
                    <label for="name" style="color: #ff0000;"> > Name</label><br>
                    <input type="text" id="name" name="name"><br>
                </div>
                <div class="card-content">
                    <label for="moon"style="color: #ff0000;"> > Moon of Origin</label><br>
                    <input type="text" id="moon" name="moon"><br>
                </div>
                <div class="card-content">
                    <label for="position"style="color: #ff0000;">> Last position worked</label><br>
                    <input type="text" id="position" name="position"><br>
                </div>
                <div class="card-content">
                    <label for="skills"style="color: #ff0000;">> Skills to offer</label><br>
                    <input type="text" id="skills" name="skills"><br>
                </div>
                <div class="card-content">
                    <label for="criminal"style="color: #ff0000;">> Any past criminal negligence</label><br>
                    <input type="text" id="criminal" name="criminal"><br>
                </div>
                <button class="card-button" id="save"> >Save Application</button>
                <button class="card-button" id="delete"> >Delete Application</button>
                <button class="card-button" id="retrieve"> >Retrieve Saved Data</button>
                <button class="card-button" id="send"> >Send Application</button>
                <div id="saved-data"></div>
            </div>
        </div>
    </div>
    

    
    <footer class="footer">
    <p>Contact us: The@Compnayteam.llc | Phone: 123-456-7890</p>
    </footer>
    <script src="./js/submit.js"></script>
</body>
</html>
